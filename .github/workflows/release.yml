name: Release Jam Layer APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: android-actions/setup-android@v3
      - name: Configure Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JAM_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jam-release.p12"
      - name: Build signed APK and tests
        env:
          JAM_KEYSTORE_PATH: ${{ runner.temp }}/jam-release.p12
          JAM_KEYSTORE_PASSWORD: ${{ secrets.JAM_KEYSTORE_PASSWORD }}
          JAM_KEY_ALIAS: ${{ secrets.JAM_KEY_ALIAS }}
          JAM_KEY_PASSWORD: ${{ secrets.JAM_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" app/build/outputs/apk/release/app-release.apk \
            --repo "$GITHUB_REPOSITORY" --title "Jam Layer $RELEASE_TAG" \
            --notes "Signed Jam Layer APK. See the repository README for compatible patch source and installation notes."
